name: Deploy to purr001

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-purr001
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PURR001_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.PURR001_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync build to purr001
        run: |
          rsync -az --delete \
            build/ deploy@${{ secrets.PURR001_HOST }}:/opt/purr-you/build/
          rsync -az \
            package.json deploy@${{ secrets.PURR001_HOST }}:/opt/purr-you/
          rsync -az \
            deploy/purr-you.service deploy/purr.you.nginx \
            deploy@${{ secrets.PURR001_HOST }}:/opt/purr-you/deploy/

      - name: Reload services
        run: |
          ssh deploy@${{ secrets.PURR001_HOST }} '
            set -e
            sudo -n cp /opt/purr-you/deploy/purr-you.service /etc/systemd/system/purr-you.service
            sudo -n cp /opt/purr-you/deploy/purr.you.nginx /etc/nginx/sites-available/purr.you
            sudo -n ln -sf /etc/nginx/sites-available/purr.you /etc/nginx/sites-enabled/purr.you
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable --now purr-you
            sudo -n systemctl restart purr-you
            sudo -n nginx -t
            sudo -n systemctl reload nginx
          '
